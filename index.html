<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    .payment {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .payment h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .payment p {
      margin: 7px 0;
      font-size: 16px;
    }
    .venmo h2 {
      color: #008cff;
    }
    .zelle h2 {
      color: #6d1ed4;
    }
    .paypal h2 {
      color: #003087;
    }
    .copy-btn {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #222;
      color: white;
    }
    .copy-btn:hover {
      opacity: 0.85;
    }
    .notice {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Información de Pago</h1>
      <div class="subtitle">
        Elige el método de pago que prefieras.
      </div>
      <!-- PAYPAL -->
      <div class="payment paypal">
        <h2>PayPal</h2>
        <p><strong>PayPal:</strong> Agrega aquí tu información de PayPal</p>
      </div>
      <!-- VENMO -->
      <div class="payment venmo">
        <h2>Venmo</h2>
        <p><strong>Usuario:</strong> @novapeps22</p>
        <p><strong>Nombre:</strong> Araceli Hernández</p>
        <button class="copy-btn"
          onclick="copiar('@novapeps22')">
          Copiar Venmo
        </button>
      </div>
      <!-- ZELLE -->
      <div class="payment zelle">
        <h2>Zelle</h2>
        <p><strong>Nombre:</strong> Araceli Hernández</p>
        <p><strong>Teléfono:</strong> (832) 273-9625</p>
        <button class="copy-btn"
          onclick="copiar('(832) 273-9625')">
          Copiar teléfono
        </button>
      </div>
      <div class="notice">
        Por favor verifica la información antes de enviar tu pago.
      </div>
    </div>
  </div>
  <script>
    function copiar(texto) {
      navigator.clipboard.writeText(texto)
        .then(function() {
          alert("Información copiada");
        })
        .catch(function() {
          alert("No se pudo copiar la información.");
        });
    }
  </script>
</body>
</html>
